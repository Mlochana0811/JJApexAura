server {
  listen 80;
  server_name _;
  client_max_body_size 12m;
  root /usr/share/nginx/html;
  location = / { return 302 /app/; }
  location /app/ { try_files $uri /index.html; }
  location /assets/ { try_files $uri =404; expires 7d; }
  location /static/ { alias /srv/static/; }
  location /media/logos/ { alias /srv/media/logos/; }
  location /media/ { return 404; }
  location / {
    proxy_pass http://backend:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}
