services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hr
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr -d hr"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_DB: hr
      POSTGRES_USER: hr
      POSTGRES_HOST: db
      PUBLIC_URL: http://localhost:8080/app
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    volumes:
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
volumes:
  postgres_data:
  media_data:
  static_data:
