{% extends "base.html" %}{% block content %}
<div class="login card">
  <h1>Set your password</h1>
  {% if user.must_change_password %}<p class="sub">Welcome! Please choose your own password before you continue.</p>{% endif %}
  <form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn">Save password</button></form>
</div>
{% endblock %}
